# Builds every download and, for a version tag, publishes them as a GitHub release.
#   git tag v0.3.0 && git push --tags        (the tag must match the version in pyproject.toml)
# Run it by hand from the Actions tab, or push a build/<anything> branch, to get the builds as run artifacts without
# a release.
name: build
on:
  push:
    tags: ['v*']
    branches: ['build/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - if: startsWith(github.ref, 'refs/tags/v')
        name: tag matches the package version
        run: |
          v=$(python -c "import schematrix; print(schematrix.__version__)")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but version $v"; exit 1; }

  native:      # AppImage + .deb, setup .exe + .zip, .dmg
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]     # 22.04: the oldest glibc the Linux builds support
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 python3-gi
      - if: runner.os == 'Windows'
        name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # Cairo for PDF / PNG export, bundled into the Windows and macOS apps so users install nothing
      - if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@v2
        with: { msystem: UCRT64, install: mingw-w64-ucrt-x86_64-cairo, update: false }
      - if: runner.os == 'macOS'
        run: brew install cairo
      - run: pip install ".[desktop]" pyinstaller
      - name: pyinstaller
        shell: bash
        env: { SCHEMATRIX_REQUIRE_CAIRO: '${{ runner.os != ''Linux'' && ''1'' || '''' }}' }
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PATH="$(cygpath -u '${{ steps.msys.outputs.msys2-location }}')/ucrt64/bin:$PATH"; fi
          pyinstaller packaging/schematrix.spec --noconfirm
      # the packaged app itself must export PDF and PNG (Cairo's build folders are not on PATH here)
      - name: smoke test
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) exe=dist/Schematrix/Schematrix.exe ;;
            macOS) exe=dist/Schematrix.app/Contents/MacOS/Schematrix; ls dist/Schematrix.app/Contents/Frameworks/libcairo.2.dylib ;;
            *) exe=dist/Schematrix/Schematrix ;;
          esac
          "$exe" render schematrix/examples/analog/inverting-amplifier.json -o smoke -f pdf,png
          ls -l smoke
          ls smoke/*.pdf smoke/*.png
      - run: python packaging/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Schematrix-${{ runner.os }}
          path: dist/release/*
          if-no-files-found: error

  python:      # wheel and source archive
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: Schematrix-python
          path: dist/*
          if-no-files-found: error

  docker:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { packages: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: img     # image names must be lower case
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        env: { DOCKER_BUILD_RECORD_UPLOAD: false }     # no build-record artifact in the release
        with:
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, python, docker]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, pattern: 'Schematrix-*', merge-multiple: true }
      - run: ls -l files
      - uses: softprops/action-gh-release@v2
        with:
          name: Schematrix ${{ github.ref_name }}
          generate_release_notes: true
          files: files/*
