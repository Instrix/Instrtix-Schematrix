<svg viewBox="0 0 1120 480" width="1120" height="480" role="img" aria-label="Tap 6 with the isolation FET Qi off. Left: its gate-drain and drain-source capacitance, about 0.8 nF, go from I minus to nodes held at I+, which slows tap 6 to 236 kHz at the ADC. Right: Qb and Rtih tie the gate and ihi to a follower that copies the voltage of I minus, so no current flows through them." xmlns="http://www.w3.org/2000/svg"><style>
.w { fill: none; stroke: #292b31; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.plate { stroke-width: 2.2; }
