<svg viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="DUT test bench: a 3.3 volt supply returns through the ladder; the DUT is a switched load conductance with its decoupling capacitor and ESR between I minus and the supply return" xmlns="http://www.w3.org/2000/svg"><style>
.w { fill: none; stroke: #292b31; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.plate { stroke-width: 2.2; }
.acc { stroke: #23699f; stroke-width: 2.2; }
.para { stroke-dasharray: 5 3; }
.accf { fill: #23699f; }
.dot, .arrow { fill: #292b31; }
.amp { fill: #ffffff; stroke: #292b31; stroke-width: 1.6; }
.pad { fill: #ffffff; stroke: #292b31; stroke-width: 1.4; }
.term { fill: #ffffff; stroke: #292b31; stroke-width: 1.8; }
.flag { fill: #eef0f4; stroke: #292b31; stroke-width: 1.2; }
.box { fill: #eef0f4; stroke: #292b31; stroke-width: 1.6; }
.grp { fill: #eef0f4; stroke: none; }
text { font-family: "JetBrains Mono", monospace; fill: #292b31; }
.lbl, .ref { font-size: 12px; font-weight: 500; }
.val { font-size: 11.5px; fill: #545866; }
.valsm { font-size: 10.5px; fill: #545866; }
.node { font-size: 12px; font-weight: 500; font-style: italic; }
.net { font-size: 11px; font-weight: 500; }
.pin { font-size: 13px; font-weight: 600; }
.termlbl { font-size: 12.5px; font-weight: 600; }
.accl { font-size: 12px; font-weight: 600; fill: #23699f; }
.grplbl { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #545866; }
.note { font-family: "Inter", sans-serif; font-size: 12px; fill: #545866; }
</style><rect width="900" height="470" fill="#ffffff"/><polyline class="w" points="80,400 80,90 140,90"/><polyline class="w" points="80,400 80,408"/><polyline class="w" points="70,408 90,408"/><polyline class="w" points="74,412 86,412"/><polyline class="w" points="78,416 82,416"/><text class="node" x="80" y="436" text-anchor="middle">I+ = node 0</text><rect class="box" x="140" y="60" width="170" height="60" rx="3"/><text class="ref" x="225.0" y="78" text-anchor="middle">Ladder, switches</text><text class="valsm" x="225.0" y="96" text-anchor="middle">as the ladder bench</text><polyline class="w" points="310,90 420,90"/><text class="node" x="330" y="80" text-anchor="start">I− (im)</text><polyline class="w" points="420,90 420,130"/><circle class="dot" cx="420" cy="90" r="3"/><polyline class="w" points="420,90 560,90 560,130"/><rect class="pad" x="404" y="150" width="32" height="60" rx="2"/><polyline class="w" points="420,130 420,150"/><polyline class="w" points="420,210 420,250"/><text class="lbl" x="394" y="172" text-anchor="end">Bload</text><text class="valsm" x="394" y="188" text-anchor="end">I = V(im,dsup) × G(t)</text><text class="valsm" x="394" y="202" text-anchor="end">G: 1 µA → 50 mA at 3.3 V</text><polyline class="w" points="560,130 560,156.0"/><polyline class="w" points="560,164.0 560,190"/><polyline class="w plate" points="549,156.0 571,156.0"/><polyline class="w plate" points="549,164.0 571,164.0"/><text class="val" x="578" y="164" text-anchor="start">Cdut 10 µF (1 µF, 100 nF)</text><polyline class="w" points="560,190 560,205.0 554,207.5 566,212.5 554,217.5 566,222.5 554,227.5 566,232.5 560,235.0 560,250"/><text class="val" x="578" y="224" text-anchor="start">ESR 10 mΩ</text><polyline class="w" points="420,250 560,250"/><circle class="dot" cx="490" cy="250" r="3"/><polyline class="w" points="490,250 490,280"/><text class="node" x="500" y="272" text-anchor="start">dsup</text><polyline class="w" points="490,280 490,314.0"/><polyline class="w" points="490,346.0 490,380"/><circle class="amp" cx="490" cy="330.0" r="16"/><text class="pin" x="490" y="327.0" text-anchor="middle">−</text><text class="pin" x="490" y="342.0" text-anchor="middle">+</text><text class="lbl" x="514" y="328.0" text-anchor="start">Vsup 3.3 V</text><text class="valsm" x="514" y="343.0" text-anchor="start">dsup at −3.3 V against I+</text><polyline class="w" points="490,380 490,400 80,400"/><text class="note" x="80" y="30" text-anchor="start">DUT voltage = V(im) − V(dsup); DUT current = i(Vsup) (load + capacitor); Cdut starts charged (ic = 3.3 V)</text></svg>