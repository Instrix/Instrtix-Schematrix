<svg viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Standalone chain for the anti-alias filter sweep: a source, an optional RC for tap 6 node pole, a single-pole stage 1 and the downstream block with the filter under test" xmlns="http://www.w3.org/2000/svg"><style>
