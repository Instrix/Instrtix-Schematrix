s="w" points="810,80 840,80"/><circle class="dot" cx="840" cy="80" r="3"/><text class="node" x="848" y="84" text-anchor="start">out</text><text class="note" x="60" y="30" text-anchor="start">.ac 1 kHz–20 MHz and .tran (10 % → 100 % FS) on chains A/B and C; no ladder, no switches</text></svg>