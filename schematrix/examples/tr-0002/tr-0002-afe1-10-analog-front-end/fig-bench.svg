<svg viewBox="0 0 880 600" width="880" height="600" role="img" aria-label="Ladder test bench: I+ is the simulator ground; the ladder, tap switches, isolation network and enable network sit between it and I minus; an ideal current source draws the DUT current from I minus; three stage-1 amplifiers and their downstream blocks give the ADC nodes" xmlns="http://www.w3.org/2000/svg"><style>
.w { fill: none; stroke: #292b31; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.plate { stroke-width: 2.2; }
.acc { stroke: #23699f; stroke-width: 2.2; }
.para { stroke-dasharray: 5 3; }
.accf { fill: #23699f; }
.dot, .arrow { fill: #292b31; }
.amp { fill: #ffffff; stroke: #292b31; stroke-width: 1.6; }
.pad { fill: #ffffff; stroke: #292b31; stroke-width: 1.4; }
.term { fill: #ffffff; stroke: #292b31; stroke-width: 1.8; }
.flag { fill: #eef0f4; stroke: #292b31; stroke-width: 1.2; }
.box { fill: #eef0f4; stroke: #292b31; stroke-width: 1.6; }
.grp { fill: #eef0f4; stroke: none; }
text { font-family: "JetBrains Mono", monospace; fill: #292b31; }
.lbl, .ref { font-size: 12px; font-weight: 500; }
.val { font-size: 11.5px; fill: #545866; }
.valsm { font-size: 10.5px; fill: #545866; }
.node { font-size: 12px; font-weight: 500; font-style: italic; }
.net { font-size: 11px; font-weight: 500; }
.pin { font-size: 13px; font-weight: 600; }
.termlbl { font-size: 12.5px; font-weight: 600; }
.accl { font-size: 12px; font-weight: 600; fill: #23699f; }
.grplbl { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #545866; }
.note { font-family: "Inter", sans-serif; font-size: 12px; fill: #545866; }
</style><rect width="880" height="600" fill="#ffffff"/><polyline class="w" points="60,300 60,308"/><polyline class="w" points="50,308 70,308"/><polyline class="w" points="54,312 66,312"/><polyline class="w" points="58,316 62,316"/><text class="node" x="60" y="336" text-anchor="middle">I+ = node 0</text><polyline class="w" points="60,300 60,120 110,120"/><polyline class="w" points="110,120 135.0,120 137.5,114 142.5,126 147.5,114 152.5,126 157.5,114 162.5,126 165.0,120 190,120"/><text class="val" x="150" y="104" text-anchor="middle">Rhd 1 µΩ</text><circle class="dot" cx="200" cy="120" r="3"/><text class="node" x="200" y="104" text-anchor="middle">hd</text><polyline class="w" points="190,120 230,120"/><rect class="box" x="230" y="70" width="170" height="110" rx="3"/><text class="ref" x="315.0" y="88" text-anchor="middle">Ladder R1–R6</text><text class="valsm" x="315.0" y="106" text-anchor="middle">10 mΩ … 1 kΩ cumulative</text><text class="valsm" x="315.0" y="120" text-anchor="middle">nodes t1 … t6</text><polyline class="w" points="400,120 450,120"/><rect class="box" x="450" y="60" width="200" height="130" rx="3"/><text class="ref" x="550.0" y="78" text-anchor="middle">Tap switches</text><text class="valsm" x="550.0" y="96" text-anchor="middle">2× CSD17577Q3A, AO3400A ×2,</text><text class="valsm" x="550.0" y="110" text-anchor="middle">2N7002E ×3; UCC2752x drivers,</text><text class="valsm" x="550.0" y="124" text-anchor="middle">22 Ω gates, GND on I+</text><text class="valsm" x="550.0" y="138" text-anchor="middle">EN1–EN6: PWL timeline</text><rect class="box" x="450" y="220" width="200" height="110" rx="3"/><text class="ref" x="550.0" y="238" text-anchor="middle">Isolation (group H)</text><text class="valsm" x="550.0" y="256" text-anchor="middle">Qi CSD17577Q3A, 330 Ω</text><text class="valsm" x="550.0" y="270" text-anchor="middle">Qb 2N7002E, U7 OPA2156</text><text class="valsm" x="550.0" y="284" text-anchor="middle">Rtih 330 Ω; ihi, gm</text><rect class="box" x="220" y="220" width="180" height="110" rx="3"/><text class="ref" x="310.0" y="238" text-anchor="middle">Enable network</text><text class="valsm" x="310.0" y="256" text-anchor="middle">BAT54 OR, RC nodes A, B</text><text class="valsm" x="310.0" y="270" text-anchor="middle">UCC27525 model</text><text class="valsm" x="310.0" y="284" text-anchor="middle">→ EN_ISO, EN_B</text><polyline class="w" points="400,275 450,275"/><polyline class="w" points="550,190 550,220"/><polyline class="w" points="650,125 730,125"/><polyline class="w" points="650,275 730,275"/><polyline class="w" points="730,125 730,400"/><circle class="dot" cx="730" cy="275" r="3"/><text class="node" x="742" y="140" text-anchor="start">I− (im)</text><polyline class="w" points="730,400 730,434.0"/><polyline class="w" points="730,466.0 730,500"/><circle class="amp" cx="730" cy="450.0" r="16"/><polyline class="w" points="730,441.0 730,458.0"/><polygon class="arrow" points="726,453.0 734,453.0 730,460.0"/><text class="lbl" x="754" y="448.0" text-anchor="start">Idut</text><text class="valsm" x="754" y="463.0" text-anchor="start">PWL per suite</text><polyline class="w" points="730,500 730,520"/><polyline class="w" points="730,520 730,528"/><polyline class="w" points="720,528 740,528"/><polyline class="w" points="724,532 736,532"/><polyline class="w" points="728,536 732,536"/><polygon class="flag" points="90,400 82,391 59,391 59,409 82,409"/><text class="net" x="70.3" y="404" text-anchor="middle">t3</text><polyline class="w" points="90,400 130,400"/><rect class="box" x="130" y="378" width="150" height="44" rx="3"/><text class="ref" x="205.0" y="396" text-anchor="middle">Stage 1 A</text><text class="valsm" x="205.0" y="414" text-anchor="middle">OPA210 ×4.98</text><polyline class="w" points="280,400 310,400"/><rect class="box" x="310" y="378" width="190" height="44" rx="3"/><text class="ref" x="405.0" y="396" text-anchor="middle">DOWNSTREAM</text><text class="valsm" x="405.0" y="414" text-anchor="middle">stage 2, 3, AAF, ADC net</text><polyline class="w" points="500,400 540,400"/><circle class="dot" cx="540" cy="400" r="3"/><text class="node" x="548" y="404" text-anchor="start">ainA</text><polygon class="flag" points="90,460 82,451 59,451 59,469 82,469"/><text class="net" x="70.3" y="464" text-anchor="middle">t5</text><polyline class="w" points="90,460 130,460"/><rect class="box" x="130" y="438" width="150" height="44" rx="3"/><text class="ref" x="205.0" y="456" text-anchor="middle">Stage 1 B</text><text class="valsm" x="205.0" y="474" text-anchor="middle">OPA210 ×4.98</text><polyline class="w" points="280,460 310,460"/><rect class="box" x="310" y="438" width="190" height="44" rx="3"/><text class="ref" x="405.0" y="456" text-anchor="middle">DOWNSTREAM</text><text class="valsm" x="405.0" y="474" text-anchor="middle">stage 2, 3, AAF, ADC net</text><polyline class="w" points="500,460 540,460"/><circle class="dot" cx="540" cy="460" r="3"/><text class="node" x="548" y="464" text-anchor="start">ainB</text><polygon class="flag" points="90,520 82,511 59,511 59,529 82,529"/><text class="net" x="70.3" y="524" text-anchor="middle">t6</text><polyline class="w" points="90,520 130,520"/><rect class="box" x="130" y="498" width="150" height="44" rx="3"/><text class="ref" x="205.0" y="516" text-anchor="middle">Stage 1 C</text><text class="valsm" x="205.0" y="534" text-anchor="middle">2× OPA387 ×4.09, avg</text><polyline class="w" points="280,520 310,520"/><rect class="box" x="310" y="498" width="190" height="44" rx="3"/><text class="ref" x="405.0" y="516" text-anchor="middle">DOWNSTREAM</text><text class="valsm" x="405.0" y="534" text-anchor="middle">stage 2, 3, AAF, ADC net</text><polyline class="w" points="500,520 540,520"/><circle class="dot" cx="540" cy="520" r="3"/><text class="node" x="548" y="524" text-anchor="start">ainC</text><text class="valsm" x="130" y="366" text-anchor="start">TI vendor models (noisy=0)</text><text class="valsm" x="310" y="366" text-anchor="start">behavioural (downstream_m080.inc)</text><text class="note" x="60" y="40" text-anchor="start">Probes: I(ladder) = V(hd) / 1 µΩ;  burden = −V(im);  reading = V(ainA … ainC)</text><text class="note" x="60" y="58" text-anchor="start">Rails ±5 V (stage 1 A/B), ±2.5 V (stage 1 C, U7), +5 V (drivers, from I+); every source ideal</text></svg>