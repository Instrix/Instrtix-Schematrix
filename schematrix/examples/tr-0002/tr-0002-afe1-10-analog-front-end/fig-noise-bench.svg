<svg viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Where the transient noise sources sit: a current source across every ladder resistor, a voltage source in series with the owner chain stage-1 input and with the follower input, and with NOISE_DS the downstream op-amps and resistors" xmlns="http://www.w3.org/2000/svg"><style>
