ine class="w" points="752,140 756,140"/><polyline class="w" points="684,125 660,125"/><circle class="amp" cx="644" cy="125" r="16"/><text class="lbl" x="644" y="129" text-anchor="middle">eₙ</text><polyline class="w" points="628,125 600,125"/><polygon class="flag" points="600,125 592,116 569,116 569,134 592,134"/><text class="net" x="580.3" y="129" text-anchor="middle">I−</text><text class="ref" x="720" y="60" text-anchor="middle">Follower U7</text><text class="valsm" x="720" y="210" text-anchor="middle">OPA2156 2.8 nV/√Hz</text><text class="note" x="40" y="262" text-anchor="start">NOISE_DS=1 adds, in the owner chain's DOWNSTREAM block: 5.2 nV/√Hz on each OPA2189 / OPA4189 + input, and</text><text class="note" x="40" y="280" text-anchor="start">√(4kT/R) across every resistor of stages 2–3, the filter and the ADC network. ADC noise is added in the analysis.</text><text class="note" x="40" y="304" text-anchor="start">Each source: Vnz (TRNOISE, unit density, Ts = 9.7 ns) → B-source × V(ngate); ngate steps 0 → 1 at 30–31 µs.</text></svg>