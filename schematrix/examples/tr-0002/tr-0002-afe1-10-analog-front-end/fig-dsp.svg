<svg viewBox="0 0 962 170" width="962" height="170" role="img" aria-label="Digital compensation pipeline: ADCs, chain select, per-tap calibration, range-switch correction, timestamp shift by group delay, then power, charge and averaging" xmlns="http://www.w3.org/2000/svg"><style>
.w { fill: none; stroke: #292b31; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
